# pnpm workspace configuration (pnpm 11).
#
# IMPORTANT: In pnpm 11 the settings below (overrides, allowBuilds,
# minimumReleaseAge, engineStrict, ...) live HERE as top-level keys — NOT in
# .npmrc and NOT in package.json's "pnpm" field (pnpm 11 no longer reads it).
# .npmrc holds only registry/auth.

packages:
  # Every workspace member lives under packages/*. The runtime may split into
  # sub-packages (e.g. session-router), so the tree can nest one level deeper
  # there — hence the explicit glob below.
  - "packages/*"
  - "packages/runtime/*"

# Centralized version catalog. Reference from any package.json with the
# "catalog:" protocol.
catalog:
  # Shared toolchain (kept in lockstep with the root devDependencies so every
  # package typechecks/tests against the same versions).
  "@types/node": "^24.13.2"
  typescript: "~5.9.3"
  vitest: "^3.2.4"
  # Logging stack for @basalt/observability. pino writes structured JSONL;
  # pino-roll rotates those files by size + daily; pino-pretty is the dev-only
  # console transport.
  pino: "^10.0.0"
  pino-pretty: "^13.0.0"
  pino-roll: "^4.0.0"
  # CLI stack for @basalt/cli. commander parses args + subcommands; picocolors is
  # the tiny (zero-dependency) terminal color library used for output styling.
  commander: "^15.0.0"
  picocolors: "^1.1.1"
  # Schema + validation stack for @basalt/config. zod defines the typed config
  # schemas, drives validation on load/mutation, and is introspected to locate
  # secret-bearing fields (see @basalt/config's secret-field walker).
  zod: "^4.4.3"

# Build-script allowlist. In pnpm 11 this replaces pnpm 10's
# `onlyBuiltDependencies`. With strictDepBuilds: true, any dependency that ships
# an install/build script must be reviewed here (true = allow, false = reviewed
# and denied) or the install fails. lefthook is explicitly denied — its git-hook
# installation is handled by the root `prepare` script, not a postinstall.
allowBuilds:
  # esbuild is pulled in by vitest and fetches its platform-native binary in a
  # postinstall; without this the test runner cannot start.
  esbuild: true
  lefthook: false

# Supply-chain hardening: refuse to install any version published less than N
# minutes ago (default 1440 = 24h). Exempt packages/patterns via the exclude
# list (e.g. your own workspace scope before its first publish).
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []

# pnpm 11 security-relevant settings, pinned explicitly so a future default
# change cannot silently weaken the config.
engineStrict: true
strictDepBuilds: true
autoInstallPeers: true
